<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Dashboard - Who works on what - Datapilot</title>
<link rel="icon" type="image/png" href="./datapilot logo design.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0F2A3D; --navy-dark: #081826; --teal: #3FA6B8; --amber: #F5A623;
    --amber-soft: #FFE4B5; --pink: #D87B89; --bg: #FFFCF5; --card: #FFFFFF;
    --border: #EAE6DA; --muted: #6B7280; --text: #1A1A1A; --green: #16A34A;
    --green-bg: #DCFCE7; --red: #DC2626; --red-bg: #FEE2E2; --sub-bg: #F7F4EB;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg); color: var(--text); padding-bottom: 60px;
  }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 24px 16px; }

  header.top {
    display: flex; align-items: center; gap: 18px;
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    color: white; padding: 22px 26px; border-radius: 16px; margin-bottom: 16px;
  }
  header.top .logo { height: 42px; width: auto; }
  header.top h1 { margin: 0; font-size: 21px; font-weight: 700; }
  header.top p { margin: 3px 0 0; font-size: 13px; color: #9CA3AF; }
  .meta { margin-left: auto; font-size: 12px; color: #9CA3AF; text-align: right; }

  /* KPI cards */
  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .kpi .n { font-size: 24px; font-weight: 700; color: var(--navy); line-height: 1.1; }
  .kpi .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
  .kpi.good .n { color: var(--green); }

  /* toolbar */
  .toolbar {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .trow { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  .chips { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chips .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-right: 2px; }
  .chips button, .ddbtn {
    font-family: inherit; font-size: 12px; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    cursor: pointer; transition: all 0.12s;
  }
  .chips button:hover, .ddbtn:hover { border-color: var(--teal); }
  .chips button.on { background: var(--navy); color: white; border-color: var(--navy); }
  .chips button[disabled] { opacity: 0.4; cursor: not-allowed; }
  .chips button.on.src-planned { background: var(--amber); border-color: var(--amber); color: var(--navy); }
  input[type="date"] {
    font-family: inherit; font-size: 12px; padding: 5px 8px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--card); color: var(--text);
  }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text); cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--teal); }
  .refresh { margin-left: auto; font-family: inherit; font-size: 12px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--teal); background: var(--teal); color: white; cursor: pointer; font-weight: 500; }
  .refresh:hover { background: #369aab; }
  .refresh[disabled] { opacity: 0.5; cursor: default; }

  /* filter dropdowns */
  .dd { position: relative; display: inline-block; }
  .ddbtn { display: inline-flex; align-items: center; gap: 6px; }
  .ddbtn .cnt { background: var(--teal); color: white; border-radius: 999px; font-size: 10px; font-weight: 600; padding: 1px 7px; }
  .ddpanel {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 60; width: 300px; max-height: 340px;
    overflow: auto; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.14); padding: 10px; display: none;
  }
  .ddpanel.open { display: block; }
  .ddpanel .ddsearch { width: 100%; font-family: inherit; font-size: 12px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
  .ddpanel .ddtools { display: flex; gap: 8px; margin-bottom: 8px; }
  .ddpanel .ddtools button { font-family: inherit; font-size: 11px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); cursor: pointer; }
  .ddrow { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .ddrow:hover { background: var(--sub-bg); }
  .ddrow input { accent-color: var(--teal); }
  .ddrow .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }

  /* section cards */
  .section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
  .section h2 { margin: 0 0 4px; font-size: 15px; color: var(--navy); font-weight: 600; }
  .section .hint { font-size: 12px; color: var(--muted); margin: 0 0 14px; }
  .panels { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; }

  /* who works grid */
  .wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .wcard { border: 1px solid var(--border); border-radius: 12px; padding: 13px 14px; background: var(--card); }
  .wc-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 9px; }
  .wc-name { font-weight: 600; font-size: 14px; color: var(--navy); }
  .wc-badge { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.3px; }
  .wc-total { margin-left: auto; font-weight: 700; font-size: 14px; color: var(--navy); }
  .sbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--sub-bg); margin-bottom: 10px; }
  .sbar span { display: block; height: 100%; }
  .wc-list { display: flex; flex-direction: column; gap: 5px; }
  .wc-li { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .wc-li .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .wc-li .wc-l { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wc-li .wc-sub { color: var(--muted); font-size: 11px; }
  .wc-li .wc-v { margin-left: auto; font-weight: 600; color: var(--navy); white-space: nowrap; }

  /* matrix */
  .mtx-scroll { overflow-x: auto; }
  table.mtx { border-collapse: collapse; font-size: 12px; min-width: 100%; }
  table.mtx th, table.mtx td { border: 1px solid var(--border); padding: 7px 9px; text-align: center; white-space: nowrap; }
  table.mtx thead th { background: var(--navy); color: white; font-weight: 600; position: sticky; top: 0; }
  table.mtx th.person-col, table.mtx td.person-col { text-align: left; position: sticky; left: 0; background: var(--card); font-weight: 500; z-index: 1; }
  table.mtx thead th.person-col { background: var(--navy); z-index: 2; }
  table.mtx td.zero { color: #C9C9C9; }
  table.mtx tfoot td { font-weight: 700; background: var(--sub-bg); }
  table.mtx .rowtot { font-weight: 700; background: var(--sub-bg); }

  /* trend */
  .trend { display: flex; align-items: flex-end; gap: 8px; height: 190px; padding-top: 8px; overflow-x: auto; }
  .tcol { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 34px; }
  .tbar { width: 26px; background: var(--sub-bg); border-radius: 5px 5px 0 0; display: flex; flex-direction: column-reverse; overflow: hidden; }
  .tbar .b1 { background: var(--teal); }
  .tbar .b2 { background: var(--amber-soft); }
  .tlab { font-size: 10px; color: var(--muted); white-space: nowrap; }
  .tval { font-size: 10px; color: var(--navy); font-weight: 600; }

  /* category split */
  .catbar { display: flex; height: 26px; border-radius: 8px; overflow: hidden; background: var(--sub-bg); margin-bottom: 12px; }
  .catbar span { display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: 600; }
  .catleg { display: flex; flex-direction: column; gap: 7px; }
  .catleg .cl { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .catleg .cl .sw { width: 12px; height: 12px; border-radius: 3px; }
  .catleg .cl .v { margin-left: auto; font-weight: 600; color: var(--navy); }

  /* detail table */
  .dwrap { overflow-x: auto; }
  table.detail { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.detail th, table.detail td { border-bottom: 1px solid var(--border); padding: 8px 10px; text-align: left; }
  table.detail thead th { background: var(--navy); color: white; font-weight: 600; cursor: pointer; white-space: nowrap; position: sticky; top: 0; }
  table.detail thead th .ar { opacity: 0.6; font-size: 10px; }
  table.detail tbody tr:nth-child(even) { background: var(--sub-bg); }
  table.detail td.num { text-align: right; font-weight: 600; color: var(--navy); white-space: nowrap; }
  .badge { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.3px; }
  .b-sprint { background: #DBEAFE; color: #1E40AF; }
  .b-regie { background: #FEF3C7; color: #92400E; }
  .b-maint { background: #E9D5FF; color: #6B21A8; }
  .b-autre { background: #E5E7EB; color: #374151; }
  .b-billing { background: var(--green-bg); color: #14532D; }
  .b-nonbilling { background: #FEF3C7; color: #92400E; }
  .b-off { background: var(--red-bg); color: #7F1D1D; }
  .b-planned { background: #E0F2FE; color: #075985; }

  .state { text-align: center; color: var(--muted); padding: 50px 20px; font-size: 14px; font-style: italic; }
  .state.error { color: var(--red); font-style: normal; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; color: var(--muted); padding: 30px; font-style: italic; }

  @media (max-width: 820px) {
    header.top { flex-direction: column; text-align: center; }
    .meta { margin: 0; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .panels { grid-template-columns: 1fr; }
    .refresh { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img src="./Datapilot_logo.png" alt="Datapilot" class="logo">
    <div>
      <h1>Team Dashboard</h1>
      <p>Who works on what. Actual time from the timesheet, or the planned days from the capacity tracker.</p>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="toolbar">
    <div class="trow">
      <span class="chips" id="src-chips"><span class="lbl">Source</span>
        <button data-src="actual" class="on">Actual (timesheet)</button>
        <button data-src="planned">Planned (capacity)</button>
      </span>
      <span class="chips" id="grp-chips"><span class="lbl">View</span>
        <button data-grp="person" class="on">By person</button>
        <button data-grp="project">By project</button>
        <button data-grp="matrix">Matrix</button>
      </span>
      <span class="chips" id="unit-chips"><span class="lbl">Unit</span>
        <button data-unit="days" class="on">Days</button>
        <button data-unit="hours">Hours</button>
      </span>
      <button class="refresh" id="refresh-btn">Refresh</button>
    </div>
    <div class="trow">
      <span class="chips" id="period-chips"><span class="lbl">Period</span>
        <button data-period="4">4 wks</button>
        <button data-period="8" class="on">8 wks</button>
        <button data-period="13">13 wks</button>
        <button data-period="all">All</button>
      </span>
      <span class="chips"><span class="lbl">Custom</span>
        <input type="date" id="from-date" title="From week">
        <input type="date" id="to-date" title="To week">
        <button id="date-clear" style="border-radius:999px">Clear</button>
      </span>
      <label class="toggle"><input type="checkbox" id="excl-auto"> Hide autofill (Autre auto)</label>
    </div>
    <div class="trow">
      <div class="dd"><button class="ddbtn" id="btn-people">People <span class="cnt" id="cnt-people">All</span></button>
        <div class="ddpanel" id="dd-people"></div></div>
      <div class="dd"><button class="ddbtn" id="btn-projects">Projects <span class="cnt" id="cnt-projects">All</span></button>
        <div class="ddpanel" id="dd-projects"></div></div>
      <span class="chips" id="type-chips"><span class="lbl">Type</span>
        <button data-type="__all" class="on">All</button>
        <button data-type="Sprint">Sprint</button>
        <button data-type="Régie">Régie</button>
        <button data-type="Maintenance">Maintenance</button>
        <button data-type="Autre">Autre</button>
      </span>
      <span class="chips" id="cat-chips"><span class="lbl">Category</span>
        <button data-cat="__all" class="on">All</button>
        <button data-cat="Billing">Billing</button>
        <button data-cat="Non-billing">Non-billing</button>
        <button data-cat="Off">Off</button>
      </span>
    </div>
  </div>

  <div id="content">
    <div class="state"><span class="spinner"></span>Loading the dashboard...</div>
  </div>
</div>

<script src="./gate.js"></script>
<script>
  const APPS_SCRIPT_URL = "https://script.google.com/a/macros/datapilot.fr/s/AKfycbyUhfW211pozOYRKOJBZM9vCcRLxDhmsm3OShM1F_1SV2HWaqpg253ekKdu75xZYiWR/exec";
  const DAY_HOURS = 8;
  const PALETTE = ['#3FA6B8','#F5A623','#D87B89','#0F2A3D','#6BBF59','#9B6BBF','#E8743B','#2E86AB','#C0392B','#16A34A','#8E44AD','#D4A017','#5D6D7E','#EC7063','#48C9B0','#AF7AC5'];
  const TYPES = ['Sprint','Régie','Maintenance','Autre'];
  const CATS = ['Billing','Non-billing','Off'];

  let DATA = { timesheet: [], capacity: [], people: [], projects: [] };
  let peopleByEmail = {};
  let projectListCache = { actual: null, planned: null };

  const F = {
    source: 'actual', group: 'person', unit: 'days',
    period: 8, from: '', to: '',
    people: new Set(), projects: new Set(), types: new Set(), cats: new Set(),
    excludeAuto: false,
    sortKey: 'value', sortDir: -1
  };

  // ---------- helpers ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
  function deacc(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
  function fmt(n) { if (typeof n !== 'number') n = parseFloat(n) || 0; if (Math.abs(n) < 1e-9) return '0'; return String(Math.round(n * 100) / 100); }
  function normEmail(e) { return String(e || '').trim().toLowerCase(); }
  function nameOf(email) { const e = normEmail(email); return peopleByEmail[e] || (e ? e.split('@')[0] : 'Unknown'); }
  function unitLbl() { return F.unit === 'days' ? 'd' : 'h'; }
  function cleanProject(name) { return String(name || '').replace(/^\s*\[[^\]]*\]\s*/, '').trim(); }
  function isAuto(task) { return /\(auto\)/i.test(String(task || '')); }
  function projectType(name) {
    const m = String(name || '').match(/^\s*\[([^\]]+)\]/);
    if (!m) return String(name || '').trim() ? 'Autre' : '';
    const p = deacc(m[1]).toLowerCase();
    if (p.indexOf('sprint') !== -1) return 'Sprint';
    if (p.indexOf('regie') !== -1) return 'Régie';
    if (p.indexOf('maintenance') !== -1) return 'Maintenance';
    return 'Autre';
  }
  function typeClass(t) { return t === 'Sprint' ? 'b-sprint' : t === 'Régie' ? 'b-regie' : t === 'Maintenance' ? 'b-maint' : 'b-autre'; }
  function catClass(c) { return c === 'Billing' ? 'b-billing' : c === 'Non-billing' ? 'b-nonbilling' : c === 'Off' ? 'b-off' : 'b-planned'; }

  function currentMonday() {
    const d = new Date(); const day = d.getDay(); const off = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + off);
    return d.toISOString().slice(0, 10);
  }
  function addWeeks(iso, n) { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n * 7); return d.toISOString().slice(0, 10); }
  function shortWeek(iso) { if (!iso) return '?'; const p = iso.split('-'); return p.length === 3 ? p[2] + '/' + p[1] : iso; }

  // ---------- normalized rows ----------
  // Build the source rows once (no filters). Each row keeps days + hours,
  // a grouping label, a project type and the category, so filters and the
  // unit switch are cheap re-reads.
  function sourceRows(src) {
    const out = [];
    if (src === 'actual') {
      DATA.timesheet.forEach(t => {
        const hasProj = !!(t.project && t.project.trim());
        out.push({
          email: normEmail(t.email), name: nameOf(t.email), week: t.week || '',
          category: t.category || '', task: t.task || '', avail: '',
          projLabel: hasProj ? cleanProject(t.project) : (t.task || t.category || '(unspecified)'),
          ptype: hasProj ? projectType(t.project) : '',
          days: t.days || 0, hours: (typeof t.hours === 'number' ? t.hours : (t.days || 0) * DAY_HOURS)
        });
      });
    } else {
      DATA.capacity.forEach(c => {
        const hasProj = !!(c.project && c.project.trim());
        out.push({
          email: normEmail(c.email), name: c.name || nameOf(c.email), week: c.week || '',
          category: 'Planned', task: '', avail: c.availability || '',
          projLabel: hasProj ? cleanProject(c.project) : (c.availability || '(unspecified)'),
          ptype: hasProj ? projectType(c.project) : '',
          days: c.days || 0, hours: (c.days || 0) * DAY_HOURS
        });
      });
    }
    return out;
  }

  function weekWindow() {
    if (F.from && F.to) return { from: F.from, to: F.to };
    if (F.from && !F.to) return { from: F.from, to: '9999-99-99' };
    if (!F.from && F.to) return { from: '0000-00-00', to: F.to };
    if (F.period === 'all') return null;
    const cur = currentMonday(); const n = parseInt(F.period, 10) || 8;
    if (F.source === 'actual') return { from: addWeeks(cur, -(n - 1)), to: cur };
    return { from: cur, to: addWeeks(cur, n - 1) };
  }

  function filteredRows() {
    const rows = sourceRows(F.source);
    const win = weekWindow();
    const out = [];
    rows.forEach(r => {
      if (win && (r.week < win.from || r.week > win.to)) return;
      if (F.people.size && !F.people.has(r.email)) return;
      if (F.projects.size && !F.projects.has(r.projLabel)) return;
      if (F.types.size && !(r.ptype && F.types.has(r.ptype))) return;
      if (F.source === 'actual' && F.cats.size && !F.cats.has(r.category)) return;
      if (F.source === 'actual' && F.excludeAuto && isAuto(r.task)) return;
      const value = F.unit === 'days' ? r.days : r.hours;
      if (!(value > 0)) return;
      out.push(Object.assign({ value: value }, r));
    });
    return out;
  }

  // ---------- rendering ----------
  function render() {
    syncControls();
    const rows = filteredRows();
    renderKPIs(rows);
    const c = document.getElementById('content');
    if (rows.length === 0) {
      c.innerHTML = '<div class="section"><div class="empty">No data for these filters. Widen the period or clear a filter.</div></div>';
      return;
    }
    let html = '';
    html += '<div class="section" id="sec-main"></div>';
    html += '<div class="panels">';
    html += '  <div class="section" id="sec-trend"></div>';
    html += '  <div class="section" id="sec-cat"></div>';
    html += '</div>';
    html += '<div class="section" id="sec-detail"></div>';
    c.innerHTML = html;
    renderMain(rows);
    renderTrend(rows);
    renderCat(rows);
    renderDetail(rows);
  }

  function renderKPIs(rows) {
    const total = rows.reduce((a, r) => a + r.value, 0);
    const people = new Set(rows.map(r => r.email)).size;
    const projs = new Set(rows.filter(r => r.ptype).map(r => r.projLabel)).size;
    const weeks = new Set(rows.map(r => r.week)).size;
    let fifth;
    if (F.source === 'actual') {
      const billing = rows.filter(r => r.category === 'Billing').reduce((a, r) => a + r.value, 0);
      const pct = total ? Math.round((billing / total) * 100) : 0;
      fifth = { n: pct + '%', l: 'Billable share', good: pct >= 60 };
    } else {
      fifth = { n: fmt(people ? total / people : 0) + ' ' + unitLbl(), l: 'Avg per person' };
    }
    const cards = [
      { n: fmt(total) + ' ' + unitLbl(), l: F.source === 'actual' ? 'Total logged' : 'Total planned' },
      { n: String(people), l: 'People' },
      { n: String(projs), l: 'Projects' },
      { n: String(weeks), l: 'Weeks' },
      fifth
    ];
    document.getElementById('kpis').innerHTML = cards.map(k =>
      '<div class="kpi' + (k.good ? ' good' : '') + '"><div class="n">' + esc(k.n) + '</div><div class="l">' + esc(k.l) + '</div></div>'
    ).join('');
  }

  function groupSum(rows, keyFn) {
    const m = new Map();
    rows.forEach(r => { const k = keyFn(r); const e = m.get(k) || 0; m.set(k, e + r.value); });
    return m;
  }

  function renderMain(rows) {
    const sec = document.getElementById('sec-main');
    if (F.group === 'matrix') { sec.innerHTML = matrixHtml(rows); return; }
    const byPerson = F.group === 'person';
    const outerKey = byPerson ? (r => r.email) : (r => r.projLabel);
    const innerKey = byPerson ? (r => r.projLabel) : (r => r.email);
    // outer groups
    const groups = new Map();
    rows.forEach(r => {
      const ok = outerKey(r);
      if (!groups.has(ok)) groups.set(ok, { total: 0, rows: [], sample: r });
      const g = groups.get(ok); g.total += r.value; g.rows.push(r);
    });
    const ordered = [...groups.entries()].sort((a, b) => b[1].total - a[1].total);
    // stable colour per inner label across the whole view
    const innerLabels = [...new Set(rows.map(innerKey))].sort();
    const colorOf = {}; innerLabels.forEach((l, i) => { colorOf[l] = PALETTE[i % PALETTE.length]; });

    const title = byPerson ? 'Who works on what, by person' : 'Who works on what, by project';
    const hint = byPerson
      ? 'Each person and the ' + (F.source === 'actual' ? 'time they logged' : 'days they are planned') + ' across projects. Bars are shares of that person total.'
      : 'Each project and the people on it. Bars are shares of that project total.';
    let h = '<h2>' + esc(title) + '</h2><p class="hint">' + esc(hint) + '</p><div class="wgrid">';
    ordered.forEach(([label, g]) => {
      const inner = groupSum(g.rows, innerKey);
      const items = [...inner.entries()].sort((a, b) => b[1] - a[1]);
      const segs = items.map(([lab, v]) => '<span title="' + esc(lab) + ': ' + fmt(v) + ' ' + unitLbl() + '" style="width:' + (g.total ? (v / g.total * 100) : 0) + '%;background:' + colorOf[lab] + '"></span>').join('');
      let list = '';
      items.forEach(([lab, v]) => {
        let sub = '';
        if (byPerson) { const t = g.rows.find(r => r.projLabel === lab); if (t && t.ptype) sub = ' <span class="wc-sub">' + esc(t.ptype) + '</span>'; }
        list += '<div class="wc-li"><span class="dot" style="background:' + colorOf[lab] + '"></span><span class="wc-l">' + esc(lab) + sub + '</span><span class="wc-v">' + fmt(v) + ' ' + unitLbl() + '</span></div>';
      });
      let badge = '';
      if (!byPerson && g.sample.ptype) badge = '<span class="wc-badge ' + typeClass(g.sample.ptype) + '">' + esc(g.sample.ptype) + '</span>';
      const heading = byPerson ? nameOf(label) : label;
      h += '<div class="wcard"><div class="wc-head"><span class="wc-name">' + esc(heading) + '</span>' + badge +
           '<span class="wc-total">' + fmt(g.total) + ' ' + unitLbl() + '</span></div>' +
           '<div class="sbar">' + segs + '</div><div class="wc-list">' + list + '</div></div>';
    });
    h += '</div>';
    sec.innerHTML = h;
  }

  function matrixHtml(rows) {
    const people = [...new Set(rows.map(r => r.email))];
    let projTotals = groupSum(rows, r => r.projLabel);
    let projs = [...projTotals.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]);
    const MAXCOL = 12; let otherProjs = [];
    if (projs.length > MAXCOL) { otherProjs = projs.slice(MAXCOL); projs = projs.slice(0, MAXCOL); }
    const cell = {}; let maxCell = 0;
    rows.forEach(r => {
      const col = projs.indexOf(r.projLabel) !== -1 ? r.projLabel : (otherProjs.length ? '__other' : r.projLabel);
      const k = r.email + '||' + col; cell[k] = (cell[k] || 0) + r.value; if (cell[k] > maxCell) maxCell = cell[k];
    });
    const cols = projs.slice(); if (otherProjs.length) cols.push('__other');
    const rowTot = {}; people.forEach(e => { rowTot[e] = 0; }); const colTot = {}; cols.forEach(c => { colTot[c] = 0; });
    cols.forEach(c => people.forEach(e => { const v = cell[e + '||' + c] || 0; rowTot[e] += v; colTot[c] += v; }));
    const peopleOrdered = people.sort((a, b) => rowTot[b] - rowTot[a]);

    let h = '<h2>Who works on what, matrix</h2><p class="hint">People down the side, projects across the top, ' +
      (F.source === 'actual' ? 'days logged' : 'days planned') + ' in each cell. Darker means more.' +
      (otherProjs.length ? ' The ' + otherProjs.length + ' smaller projects are grouped as Other.' : '') + '</p>';
    h += '<div class="mtx-scroll"><table class="mtx"><thead><tr><th class="person-col">Person</th>';
    cols.forEach(c => { h += '<th title="' + esc(c === '__other' ? 'Other projects' : c) + '">' + esc(c === '__other' ? 'Other' : c) + '</th>'; });
    h += '<th>Total</th></tr></thead><tbody>';
    peopleOrdered.forEach(e => {
      h += '<tr><td class="person-col">' + esc(nameOf(e)) + '</td>';
      cols.forEach(c => {
        const v = cell[e + '||' + c] || 0;
        const a = maxCell ? (0.12 + 0.62 * (v / maxCell)) : 0;
        const style = v > 0 ? ' style="background:rgba(63,166,184,' + a.toFixed(3) + ')"' : '';
        h += '<td class="' + (v > 0 ? '' : 'zero') + '"' + style + '>' + (v > 0 ? fmt(v) : '.') + '</td>';
      });
      h += '<td class="rowtot">' + fmt(rowTot[e]) + '</td></tr>';
    });
    h += '</tbody><tfoot><tr><td class="person-col">Total</td>';
    cols.forEach(c => { h += '<td>' + fmt(colTot[c]) + '</td>'; });
    h += '<td>' + fmt(cols.reduce((a, c) => a + colTot[c], 0)) + '</td></tr></tfoot></table></div>';
    return h;
  }

  function renderTrend(rows) {
    const sec = document.getElementById('sec-trend');
    const byWeek = new Map();
    rows.forEach(r => {
      if (!byWeek.has(r.week)) byWeek.set(r.week, { total: 0, bill: 0 });
      const w = byWeek.get(r.week); w.total += r.value; if (r.category === 'Billing') w.bill += r.value;
    });
    const weeks = [...byWeek.keys()].filter(Boolean).sort();
    const max = Math.max(1, ...weeks.map(w => byWeek.get(w).total));
    const showBill = F.source === 'actual';
    let h = '<h2>By week</h2><p class="hint">' + (F.source === 'actual' ? 'Total ' + unitLbl() + ' logged per week' + (showBill ? ', billable part in teal.' : '.') : 'Total ' + unitLbl() + ' planned per week.') + '</p><div class="trend">';
    weeks.forEach(w => {
      const d = byWeek.get(w); const hPx = Math.round(d.total / max * 150);
      const billPx = showBill && d.total ? Math.round(hPx * (d.bill / d.total)) : 0;
      h += '<div class="tcol"><div class="tval">' + fmt(d.total) + '</div>' +
        '<div class="tbar" style="height:' + hPx + 'px" title="Week of ' + esc(w) + ': ' + fmt(d.total) + ' ' + unitLbl() + (showBill ? ' (' + fmt(d.bill) + ' billable)' : '') + '">' +
        (billPx ? '<div class="b1" style="height:' + billPx + 'px"></div><div class="b2" style="height:' + (hPx - billPx) + 'px"></div>' : '<div class="b1" style="height:' + hPx + 'px"></div>') +
        '</div><div class="tlab">' + esc(shortWeek(w)) + '</div></div>';
    });
    h += '</div>';
    sec.innerHTML = h;
  }

  function renderCat(rows) {
    const sec = document.getElementById('sec-cat');
    if (F.source !== 'actual') {
      // planned: show availability split instead
      const byAv = new Map();
      rows.forEach(r => { const k = r.avail || 'Unset'; byAv.set(k, (byAv.get(k) || 0) + r.value); });
      const total = [...byAv.values()].reduce((a, b) => a + b, 0);
      const colors = { 'Disponible': '#16A34A', 'Partiel': '#F5A623', 'Chargé': '#DC2626', 'Congé': '#9CA3AF', 'Unset': '#C9C9C9' };
      let h = '<h2>By availability</h2><p class="hint">Planned days grouped by the availability set on each week.</p><div class="catleg">';
      [...byAv.entries()].sort((a, b) => b[1] - a[1]).forEach(([k, v]) => {
        h += '<div class="cl"><span class="sw" style="background:' + (colors[k] || '#5D6D7E') + '"></span><span>' + esc(k) + '</span><span class="v">' + fmt(v) + ' ' + unitLbl() + ' (' + (total ? Math.round(v / total * 100) : 0) + '%)</span></div>';
      });
      h += '</div>';
      sec.innerHTML = h; return;
    }
    const sums = { Billing: 0, 'Non-billing': 0, Off: 0 };
    rows.forEach(r => { if (sums[r.category] !== undefined) sums[r.category] += r.value; });
    const total = sums.Billing + sums['Non-billing'] + sums.Off;
    const colors = { Billing: 'var(--teal)', 'Non-billing': 'var(--amber)', Off: 'var(--pink)' };
    let bar = '';
    CATS.forEach(c => { const pct = total ? (sums[c] / total * 100) : 0; if (pct > 0) bar += '<span style="width:' + pct + '%;background:' + colors[c] + '">' + (pct > 9 ? Math.round(pct) + '%' : '') + '</span>'; });
    let leg = '';
    CATS.forEach(c => { leg += '<div class="cl"><span class="sw" style="background:' + colors[c] + '"></span><span>' + c + '</span><span class="v">' + fmt(sums[c]) + ' ' + unitLbl() + ' (' + (total ? Math.round(sums[c] / total * 100) : 0) + '%)</span></div>'; });
    sec.innerHTML = '<h2>Billable split</h2><p class="hint">Client work vs internal vs time off, for the current filters.</p>' +
      '<div class="catbar">' + bar + '</div><div class="catleg">' + leg + '</div>';
  }

  function renderDetail(rows) {
    const sec = document.getElementById('sec-detail');
    const planned = F.source !== 'actual';
    const cols = planned
      ? [['name', 'Person'], ['projLabel', 'Project'], ['ptype', 'Type'], ['avail', 'Availability'], ['week', 'Week'], ['value', F.unit === 'days' ? 'Days' : 'Hours']]
      : [['name', 'Person'], ['projLabel', 'Project'], ['ptype', 'Type'], ['category', 'Category'], ['task', 'Task / activity'], ['week', 'Week'], ['value', F.unit === 'days' ? 'Days' : 'Hours']];
    const dir = F.sortDir; const key = F.sortKey;
    const sorted = rows.slice().sort((a, b) => {
      let av = a[key], bv = b[key];
      if (key === 'value') return (av - bv) * dir;
      av = String(av || '').toLowerCase(); bv = String(bv || '').toLowerCase();
      return av < bv ? -dir : av > bv ? dir : 0;
    });
    const LIMIT = 600; const shown = sorted.slice(0, LIMIT);
    let h = '<h2>Detail</h2><p class="hint">' + rows.length + ' rows for these filters' + (rows.length > LIMIT ? ', showing first ' + LIMIT : '') + '. Click a column to sort.</p><div class="dwrap"><table class="detail"><thead><tr>';
    cols.forEach(([k, lab]) => { const ar = key === k ? (dir === 1 ? ' \u25b2' : ' \u25bc') : ''; h += '<th data-sort="' + k + '">' + esc(lab) + '<span class="ar">' + ar + '</span></th>'; });
    h += '</tr></thead><tbody>';
    shown.forEach(r => {
      h += '<tr>';
      cols.forEach(([k]) => {
        if (k === 'value') h += '<td class="num">' + fmt(r.value) + ' ' + unitLbl() + '</td>';
        else if (k === 'ptype') h += '<td>' + (r.ptype ? '<span class="badge ' + typeClass(r.ptype) + '">' + esc(r.ptype) + '</span>' : '') + '</td>';
        else if (k === 'category') h += '<td>' + (r.category ? '<span class="badge ' + catClass(r.category) + '">' + esc(r.category) + '</span>' : '') + '</td>';
        else if (k === 'name') h += '<td>' + esc(r.name) + '</td>';
        else if (k === 'week') h += '<td>' + esc(r.week) + '</td>';
        else h += '<td>' + esc(r[k] || '') + '</td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table></div>';
    sec.innerHTML = h;
    sec.querySelectorAll('th[data-sort]').forEach(th => th.addEventListener('click', () => {
      const k = th.dataset.sort;
      if (F.sortKey === k) F.sortDir = -F.sortDir; else { F.sortKey = k; F.sortDir = (k === 'value') ? -1 : 1; }
      renderDetail(filteredRows());
    }));
  }

  // ---------- filter dropdowns ----------
  function projectLabels(src) {
    if (projectListCache[src]) return projectListCache[src];
    const set = new Set(); sourceRows(src).forEach(r => { if (r.projLabel) set.add(r.projLabel); });
    const list = [...set].sort(); projectListCache[src] = list; return list;
  }
  function buildPeoplePanel() {
    const panel = document.getElementById('dd-people');
    const items = DATA.people.length ? DATA.people.slice() : [...new Set(sourceRows(F.source).map(r => r.email))].map(e => ({ email: e, name: nameOf(e) }));
    items.sort((a, b) => a.name.localeCompare(b.name));
    let h = '<input class="ddsearch" placeholder="Search people..." id="pp-search"><div class="ddtools"><button id="pp-all">All</button><button id="pp-none">None</button></div><div id="pp-list">';
    items.forEach(p => {
      const on = F.people.has(p.email);
      h += '<label class="ddrow"><input type="checkbox" data-email="' + esc(p.email) + '"' + (on ? ' checked' : '') + '><span>' + esc(p.name) + '</span></label>';
    });
    h += '</div>';
    panel.innerHTML = h;
    panel.querySelectorAll('input[data-email]').forEach(cb => cb.addEventListener('change', () => {
      if (cb.checked) F.people.add(cb.dataset.email); else F.people.delete(cb.dataset.email);
      updateFilterCounts(); render();
    }));
    document.getElementById('pp-all').addEventListener('click', () => { items.forEach(p => F.people.add(p.email)); buildPeoplePanel(); updateFilterCounts(); render(); });
    document.getElementById('pp-none').addEventListener('click', () => { F.people.clear(); buildPeoplePanel(); updateFilterCounts(); render(); });
    document.getElementById('pp-search').addEventListener('input', function () {
      const q = this.value.toLowerCase();
      panel.querySelectorAll('#pp-list .ddrow').forEach(row => { row.style.display = row.textContent.toLowerCase().indexOf(q) !== -1 ? '' : 'none'; });
    });
  }
  function buildProjectsPanel() {
    const panel = document.getElementById('dd-projects');
    const labels = projectLabels(F.source);
    let h = '<input class="ddsearch" placeholder="Search projects..." id="pr-search"><div class="ddtools"><button id="pr-all">All</button><button id="pr-none">None</button></div><div id="pr-list">';
    labels.forEach((lab, i) => {
      const on = F.projects.has(lab);
      h += '<label class="ddrow"><span class="sw" style="background:' + PALETTE[i % PALETTE.length] + '"></span><input type="checkbox" data-proj="' + esc(lab) + '"' + (on ? ' checked' : '') + '><span>' + esc(lab) + '</span></label>';
    });
    h += '</div>';
    panel.innerHTML = h;
    panel.querySelectorAll('input[data-proj]').forEach(cb => cb.addEventListener('change', () => {
      if (cb.checked) F.projects.add(cb.dataset.proj); else F.projects.delete(cb.dataset.proj);
      updateFilterCounts(); render();
    }));
    document.getElementById('pr-all').addEventListener('click', () => { labels.forEach(l => F.projects.add(l)); buildProjectsPanel(); updateFilterCounts(); render(); });
    document.getElementById('pr-none').addEventListener('click', () => { F.projects.clear(); buildProjectsPanel(); updateFilterCounts(); render(); });
    document.getElementById('pr-search').addEventListener('input', function () {
      const q = this.value.toLowerCase();
      panel.querySelectorAll('#pr-list .ddrow').forEach(row => { row.style.display = row.textContent.toLowerCase().indexOf(q) !== -1 ? '' : 'none'; });
    });
  }
  function updateFilterCounts() {
    document.getElementById('cnt-people').textContent = F.people.size ? F.people.size : 'All';
    document.getElementById('cnt-projects').textContent = F.projects.size ? F.projects.size : 'All';
  }

  // ---------- control syncing + wiring ----------
  function syncControls() {
    setChip('src-chips', 'src', F.source);
    setChip('grp-chips', 'grp', F.group);
    setChip('unit-chips', 'unit', F.unit);
    setChip('period-chips', 'period', (F.from || F.to) ? null : String(F.period));
    // type + cat multi (highlight All when empty)
    document.querySelectorAll('#type-chips button').forEach(b => {
      const t = b.dataset.type;
      b.classList.toggle('on', t === '__all' ? F.types.size === 0 : F.types.has(t));
    });
    document.querySelectorAll('#cat-chips button').forEach(b => {
      const c = b.dataset.cat;
      b.classList.toggle('on', c === '__all' ? F.cats.size === 0 : F.cats.has(c));
      b.disabled = (F.source !== 'actual');
    });
    document.getElementById('excl-auto').disabled = (F.source !== 'actual');
    // source colour hint
    document.querySelectorAll('#src-chips button').forEach(b => b.classList.toggle('src-planned', b.dataset.src === 'planned' && F.source === 'planned'));
  }
  function setChip(groupId, attr, val) {
    document.querySelectorAll('#' + groupId + ' button').forEach(b => b.classList.toggle('on', b.dataset[attr] === val));
  }

  function wire() {
    document.querySelectorAll('#src-chips button').forEach(b => b.addEventListener('click', () => {
      F.source = b.dataset.src;
      if (F.source !== 'actual') { F.cats.clear(); F.excludeAuto = false; }
      F.projects.clear(); buildProjectsPanel(); updateFilterCounts();
      document.getElementById('excl-auto').checked = false;
      render();
    }));
    document.querySelectorAll('#grp-chips button').forEach(b => b.addEventListener('click', () => { F.group = b.dataset.grp; render(); }));
    document.querySelectorAll('#unit-chips button').forEach(b => b.addEventListener('click', () => { F.unit = b.dataset.unit; render(); }));
    document.querySelectorAll('#period-chips button').forEach(b => b.addEventListener('click', () => {
      F.period = b.dataset.period === 'all' ? 'all' : parseInt(b.dataset.period, 10);
      F.from = ''; F.to = ''; document.getElementById('from-date').value = ''; document.getElementById('to-date').value = '';
      render();
    }));
    document.getElementById('from-date').addEventListener('change', e => { F.from = e.target.value; render(); });
    document.getElementById('to-date').addEventListener('change', e => { F.to = e.target.value; render(); });
    document.getElementById('date-clear').addEventListener('click', () => { F.from = ''; F.to = ''; document.getElementById('from-date').value = ''; document.getElementById('to-date').value = ''; render(); });
    document.getElementById('excl-auto').addEventListener('change', e => { F.excludeAuto = e.target.checked; render(); });
    document.querySelectorAll('#type-chips button').forEach(b => b.addEventListener('click', () => {
      const t = b.dataset.type; if (t === '__all') F.types.clear(); else { if (F.types.has(t)) F.types.delete(t); else F.types.add(t); }
      render();
    }));
    document.querySelectorAll('#cat-chips button').forEach(b => b.addEventListener('click', () => {
      if (F.source !== 'actual') return;
      const c = b.dataset.cat; if (c === '__all') F.cats.clear(); else { if (F.cats.has(c)) F.cats.delete(c); else F.cats.add(c); }
      render();
    }));
    // dropdowns open/close
    function toggleDD(btnId, panelId) {
      const panel = document.getElementById(panelId);
      const open = panel.classList.contains('open');
      document.querySelectorAll('.ddpanel').forEach(p => p.classList.remove('open'));
      if (!open) panel.classList.add('open');
    }
    document.getElementById('btn-people').addEventListener('click', e => { e.stopPropagation(); toggleDD('btn-people', 'dd-people'); });
    document.getElementById('btn-projects').addEventListener('click', e => { e.stopPropagation(); toggleDD('btn-projects', 'dd-projects'); });
    document.addEventListener('click', e => { if (!e.target.closest('.dd')) document.querySelectorAll('.ddpanel').forEach(p => p.classList.remove('open')); });
    document.getElementById('refresh-btn').addEventListener('click', () => load(false));
  }

  // ---------- data load ----------
  async function load(silent) {
    const btn = document.getElementById('refresh-btn'); btn.disabled = true;
    if (!silent) document.getElementById('content').innerHTML = '<div class="state"><span class="spinner"></span>Loading the dashboard...</div>';
    try {
      const resp = await fetch(APPS_SCRIPT_URL + '?action=dashboard' + dpQ(), { method: 'GET' });
      const data = await resp.json();
      if (data && data.error === 'unauthorized') { dpAuthFailed(); return; }
      if (!data.ok) throw new Error(data.error || 'Bad response');
      applyData(data);
      document.getElementById('meta').textContent = 'Loaded ' + new Date().toLocaleTimeString();
      render();
    } catch (err) {
      if (!silent) document.getElementById('content').innerHTML =
        '<div class="section"><div class="state error">Could not load the dashboard. Check that the backend has the "dashboard" action deployed.<br><small>' + esc(err.message) + '</small></div></div>';
    } finally { btn.disabled = false; }
  }

  function applyData(data) {
    DATA.timesheet = Array.isArray(data.timesheet) ? data.timesheet : [];
    DATA.capacity = Array.isArray(data.capacity) ? data.capacity : [];
    DATA.people = Array.isArray(data.people) ? data.people : [];
    DATA.projects = Array.isArray(data.projects) ? data.projects : [];
    peopleByEmail = {}; DATA.people.forEach(p => { peopleByEmail[normEmail(p.email)] = p.name || p.email; });
    projectListCache = { actual: null, planned: null };
    buildPeoplePanel(); buildProjectsPanel(); updateFilterCounts();
  }

  // expose for the local preview harness (ignored in production)
  window.__applyData = function (d) { applyData(d); render(); };

  wire();
  load(false);
</script>
</body>
